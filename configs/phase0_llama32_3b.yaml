# Phase 0: reproduce LLM-Check (logit + attention scores) with Llama-3.2-3B as reader.
# Llama-3.2 is gated on Hugging Face: accept the licence on its model page and
# add an HF token (Kaggle: Add-ons > Secrets > HF_TOKEN).
reader: llama3.2-3b
task: Summary
generator: llama-2-7b-chat   # same answers the original utils_ragtruth.py scored
split: train
n_samples: 200
scores: [logit, attns]
max_tokens: 2048
seed: 0
